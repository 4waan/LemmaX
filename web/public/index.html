<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LemmaX</title>
<meta name="description" content="Your agent sees how often a search has worked before it pays. If the search misses, the half cent comes back.">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="/" aria-label="LemmaX"><img src="/logo.svg" alt="" width="28" height="28"><span>Lemma<em>X</em></span></a>
  <a href="https://github.com/4waan/LemmaX" rel="noopener">GitHub</a>
</header>

<main class="stage">
  <div class="words">
    <h1>Your agent sees how often a search has worked before it pays.</h1>
    <p class="sub">If the search misses, the half cent comes back. Settled on Monad in seconds.</p>
  </div>

  <svg class="scene" id="scene" viewBox="0 0 720 230" role="img" aria-label="Money moving between your agent, Monad and a search provider">
    <path id="pathOut" class="track" d="M110 104 L610 104"/>
    <path id="pathBack" class="track back" d="M610 104 C 520 214, 200 214, 110 104"/>
    <g class="node" id="nAgent" transform="translate(110 104)"><circle r="40"/><g class="icon"><rect x="-13" y="-9" width="26" height="20" rx="7"/><circle cx="-5" cy="1" r="2.2" class="dot"/><circle cx="5" cy="1" r="2.2" class="dot"/><path d="M0 -9 V -15"/><circle cx="0" cy="-17" r="2.2" class="dot"/></g><text class="label" y="74">Your agent</text></g>
    <g class="node monad" id="nMonad" transform="translate(360 104)"><rect x="-30" y="-30" width="60" height="60" rx="14" transform="rotate(45)"/><text class="label" y="74">Monad</text></g>
    <g class="node" id="nSearch" transform="translate(610 104)"><circle r="40"/><g class="icon"><circle cx="-3" cy="-3" r="9"/><path d="M4 4 L12 12"/></g><text class="label" y="74">Search</text></g>
    <text class="tick" id="tMonad" x="360" y="40"></text>
    <text class="tick" id="tAgent" x="110" y="40"></text>
    <text class="tick" id="tSearch" x="610" y="40"></text>
    <g id="coin" class="coin" transform="translate(110 104)"><circle r="13"/><text y="5">$</text></g>
  </svg>

  <div class="moment" id="moment" aria-live="polite"></div>

  <nav class="side">
    <button type="button" id="sideA"></button>
    <button type="button" id="sideB"></button>
  </nav>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
